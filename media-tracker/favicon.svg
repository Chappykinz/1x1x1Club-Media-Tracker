<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#845EC2" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#845EC2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background squircle with shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brand-grad)" filter="url(#shadow)" />
  
  <!-- Sleek inner border overlay -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#border-grad)" stroke-width="8" />

  <!-- 1:1:1 stylized glyphs -->
  <!-- 1st "1" -->
  <path d="M 122,206 L 150,181 L 150,331" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 2nd "1" -->
  <path d="M 242,206 L 270,181 L 270,331" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 3rd "1" -->
  <path d="M 362,206 L 390,181 L 390,331" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Colon dots -->
  <!-- 1st Colon -->
  <circle cx="210" cy="226" r="14" fill="#ffffff" />
  <circle cx="210" cy="286" r="14" fill="#ffffff" />

  <!-- 2nd Colon -->
  <circle cx="330" cy="226" r="14" fill="#ffffff" />
  <circle cx="330" cy="286" r="14" fill="#ffffff" />
</svg>
